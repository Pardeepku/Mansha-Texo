    <path d="M 135 345 C 115 345 100 325 105 295 L 135 195 C 142 175 160 165 185 165 C 208 165 224 176 235 198 C 248 175 272 165 298 165 C 330 165 352 182 352 218 C 352 225 350 234 347 244 L 328 305 C 322 325 330 335 350 335 C 368 335 390 320 400 305 C 404 316 398 332 388 338 C 368 350 338 352 315 352 C 275 352 258 332 264 298 L 285 228 C 288 218 288 212 284 208 C 278 202 266 202 254 214 C 242 226 230 248 220 282 L 202 342 C 196 348 185 352 172 352 C 158 352 148 348 144 340 L 165 268 C 172 244 175 228 175 218 C 175 210 170 205 160 205 C 148 205 132 220 120 255 L 102 315 C 98 330 108 345 135 345 Z" />
    
